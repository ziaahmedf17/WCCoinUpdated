plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.get_unlimited_uc.earnuc_winuc_getuc"
    compileSdk = 36
    ndkVersion = "29.0.14033849"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.get_unlimited_uc.earnuc_winuc_getuc"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion =23
        targetSdk = 36
        versionCode = 9
        versionName = '1.9'
    }



    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
  

    release {
        minifyEnabled true
        shrinkResources false
   
        signingConfig = signingConfigs.release

        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    }
}

flutter {
    source = "../.."
}

repositories {
    google()
    mavenCentral()
    maven { url "https://artifact.bytedance.com/repository/pangle" }
}

dependencies {
    // Add mediation adapters
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    
    // Example: Meta Audience Network adapter
    implementation 'com.google.ads.mediation:facebook:6.17.0.0'
    
    // Example: Unity Ads adapter
    implementation 'com.google.ads.mediation:unity:4.12.0.0'
    
    // Example: AppLovin adapter
    implementation 'com.google.ads.mediation:applovin:12.5.0.0'
}
